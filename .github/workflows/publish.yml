name: publish

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'tag name'
        required: true
      prerelease:
        description: 'mark the release as a prerelease'
        type: boolean
        default: true
      draft:
        description: 'create a draft (not visible until published by hand)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NDK
        run: .github/scripts/install-android-ndk.sh
      - name: Build
        run: |
          cd build
          ./make_android_lua55.sh
          ./make_android_lua54.sh
          ./make_android_lua53.sh
      - name: Verify ELF machine, 16 KB alignment and exports
        run: python3 -I Test/Native/check_android_elf.py build/plugin_lua5*/Plugins/Android/libs/*/libxlua.so
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_android
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_android
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_android

  android_luajit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NDK
        run: .github/scripts/install-android-ndk.sh
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          cd build
          ./make_android_luajit.sh
      - name: Verify ELF machine, 16 KB alignment and exports
        run: python3 -I Test/Native/check_android_elf.py build/plugin_luajit/Plugins/Android/libs/*/libxlua.so
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_android

  ohos:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OpenHarmony native SDK
        run: .github/scripts/install-ohos-sdk.sh
      - name: Build
        run: |
          cd build
          ./make_ohos_lua55.sh
          ./make_ohos_lua54.sh
          ./make_ohos_lua53.sh
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_ohos
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_ohos
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_ohos

  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd build
          ./make_linux_lua55.sh
          ./make_linux_lua54.sh
          ./make_linux64_lua53.sh
          ./make_linux64_luajit.sh
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_linux
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_linux
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_linux
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_linux

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd build
          ./make_ios_lua55.sh
          ./make_ios_lua54.sh
          ./make_ios_lua53.sh
          ./make_ios_luajit.sh
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_ios
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_ios
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_ios
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_ios

  osx:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd build
          ./make_osx_lua55.sh
          ./make_osx_lua54.sh
          ./make_osx_lua53.sh
          ./make_osx_luajit.sh
          ./make_osx_silicon_lua55.sh
          ./make_osx_silicon_lua53.sh
          ./make_osx_silicon_lua54.sh
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_osx
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_osx
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_osx
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_osx

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSVC
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Build
        run: |
          cd build
          .\make_win_lua55.bat
          .\make_uwp_lua55.bat
          .\make_win_lua54.bat
          .\make_uwp_lua54.bat
          .\make_win32_lua53.bat
          .\make_win64_lua53.bat
          .\make_uwp.bat
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build Luajit
        run: |
          cd build
          .\make_win64_luajit.bat
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_window
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_window
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_window
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_window

  windows-luajit-32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSVC
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86
      - name: Build Luajit
        run: |
          cd build
          .\make_win32_luajit.bat
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_window32

  windows-arm64:
    # Native Windows on Arm. The scripts also cross-compile on windows-2022 (x64).
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: cmd
        run: |
          call build\make_win_arm64_lua55.bat || exit /b 1
          call build\make_win_arm64_lua54.bat || exit /b 1
          call build\make_win_arm64_lua53.bat || exit /b 1
          call build\make_win_arm64_luajit.bat || exit /b 1
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_window_arm64
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_window_arm64
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_window_arm64
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_window_arm64

  publish:
    runs-on: ubuntu-26.04
    needs: [windows,windows-arm64,osx,ios,android,windows-luajit-32,ohos,android_luajit,linux]
    permissions:
      contents: write
    env:
      # Passed through the environment, never interpolated into scripts.
      TAG_NAME: ${{ inputs.tag_name }}
      PRERELEASE: ${{ inputs.prerelease }}
      DRAFT: ${{ inputs.draft }}
    steps:
      # For sbom.cdx.json and the commit time used as the archive timestamp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      - name: Validate tag name
        run: |
          if [[ ! "$TAG_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::tag_name must match ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}\$"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_luajit_*
          path: plugin_luajit/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_lua53_*
          path: plugin_lua53/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_lua54_*
          path: plugin_lua54/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_lua55_*
          path: plugin_lua55/
          merge-multiple: true

      - name: Create Release Asset
        run: |
          # Archive bytes depend only on the plugin files: fixed order, owner,
          # permissions and timestamp (the commit time), and no gzip name/time.
          epoch="$(git -C source log -1 --format=%ct)"
          package() {
            for flavor in luajit lua53 lua54 lua55; do
              tar --sort=name --owner=0 --group=0 --numeric-owner --mode=u+rwX,go+rX,go-w \
                  --mtime="@$epoch" -C "plugin_${flavor}" -cf - Plugins | gzip -9n > "$1/${flavor}_${TAG_NAME}.tgz"
            done
          }
          mkdir -p assets again
          package assets
          cp source/sbom.cdx.json assets/
          (cd assets && sha256sum ./*_"${TAG_NAME}".tgz sbom.cdx.json > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Packaging the same plugins again must give the same checksums.
          package again
          (cd again && sha256sum ./*_"${TAG_NAME}".tgz) | diff - <(cd assets && sha256sum ./*_"${TAG_NAME}".tgz)

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          if [[ "$DRAFT" == true ]]; then flags+=(--draft); fi
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tag:$TAG_NAME" \
            "${flags[@]}" \
            assets/*_"${TAG_NAME}".tgz assets/sbom.cdx.json assets/SHA256SUMS.txt
