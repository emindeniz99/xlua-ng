name: publish

# Builds every native plugin, the UPM package and the release files, and checks them. With
# `release` it creates the GitHub release v<VERSION> (a draft prerelease by default); with
# `upm_branch` it pushes the package to the `upm` branch for git URL installs. Neither is the
# default: a run with the defaults builds and checks only, and leaves the files as workflow
# artifacts. The steps the owner runs, and what to check afterwards, are in
# docs/design/release.md.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'create the GitHub release v<VERSION> (off: build and check only; the files are workflow artifacts)'
        type: boolean
        default: false
      prerelease:
        description: 'mark the release as a prerelease'
        type: boolean
        default: true
      draft:
        description: 'create the release as a draft (not visible until published by hand)'
        type: boolean
        default: true
      upm_branch:
        description: 'push the package to the upm branch and the tag upm/v<VERSION> (git URL installs; public at once)'
        type: boolean
        default: false

permissions:
  contents: read

# One release run at a time; a second one waits instead of racing for the same tag or branch.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # The version comes from the VERSION file. A release or upm_branch run stops here, before any
  # build, when the version is a -dev one, CHANGELOG.md has no section for it, the run is not on
  # main, or its tags exist: the release tags rulesets forbids moving or deleting a v* tag.
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and check the version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
          UPM_BRANCH: ${{ inputs.upm_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must be a semantic version, such as 0.1.0 or 0.1.0-preview.1: $version"
            exit 1
          fi
          tag="v$version"
          if [[ "$RELEASE" == true || "$UPM_BRANCH" == true ]]; then
            problems=()
            if [[ "$version" == *-dev* ]]; then problems+=("VERSION is a development version ($version)"); fi
            if ! grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md; then problems+=("CHANGELOG.md has no section '## $version'"); fi
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then problems+=("releases are made from main, not $GITHUB_REF"); fi
            if [[ "$RELEASE" == true ]] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              problems+=("the tag $tag exists")
            fi
            if [[ "$RELEASE" == true ]] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              problems+=("a release $tag exists (a draft too)")
            fi
            if [[ "$UPM_BRANCH" == true ]] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/upm/$tag" >/dev/null 2>&1; then
              problems+=("the tag upm/$tag exists")
            fi
            # upm_branch alone pushes the package of the published release (upm-branch job).
            if [[ "$UPM_BRANCH" == true && "$RELEASE" != true ]] &&
               [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" != false ]]; then
              problems+=("upm_branch without release needs the published (not draft) release $tag")
            fi
            if (( ${#problems[@]} )); then
              for p in "${problems[@]}"; do echo "::error::$p"; done
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version $version, tag $tag, release $RELEASE, upm branch $UPM_BRANCH" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NDK
        run: .github/scripts/install-android-ndk.sh
      - name: Build
        run: |
          cd build
          ./make_android_lua55.sh
          # The variants the plugin selector takes (Core/Editor/PluginVariants.cs): minimal for
          # XLUA_PRESET_MINIMAL, core for XLUA_CORE_ONLY (build/README.md, "Plugin variants").
          XLUA_VARIANT=minimal XLUA_PRESET=minimal ./make_android_lua55.sh
          XLUA_VARIANT=core XLUA_PRESET=core ./make_android_lua55.sh
          ./make_android_lua54.sh
          ./make_android_lua53.sh
      - name: Verify ELF machine, 16 KB alignment and exports
        run: |
          set -euo pipefail
          python3 -I Test/Native/check_android_elf.py build/plugin_lua5*/Plugins/Android/libs/*/libxlua.so
          python3 -I Test/Native/check_android_elf.py --preset core build/plugin_lua55/Plugins/Android/xlua-variants/core/libs/*/libxlua.so
          eval "$(python3 -I Tools/presets.py --expect-env minimal)"
          python3 -I Test/Native/check_android_elf.py --managed-exports build/plugin_lua55/Plugins/Android/xlua-variants/minimal/libs/*/libxlua.so
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The stripped plugins; the linked libraries go to the symbols artifact below.
          path: |
            ./build/plugin_lua55/**/*
            !./build/plugin_lua55/symbols/**
          name: plugin_lua55_android
      - name: Upload the Lua 5.5 symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/symbols/
          name: android-symbols-lua55
          if-no-files-found: error
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The stripped plugins; the linked libraries go to the symbols artifact below.
          path: |
            ./build/plugin_lua54/**/*
            !./build/plugin_lua54/symbols/**
          name: plugin_lua54_android
      - name: Upload the Lua 5.4 symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/symbols/
          name: android-symbols-lua54
          if-no-files-found: error
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The stripped plugins; the linked libraries go to the symbols artifact below.
          path: |
            ./build/plugin_lua53/**/*
            !./build/plugin_lua53/symbols/**
          name: plugin_lua53_android
      - name: Upload the Lua 5.3 symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/symbols/
          name: android-symbols-lua53
          if-no-files-found: error

  android_luajit:
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NDK
        run: .github/scripts/install-android-ndk.sh
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          cd build
          ./make_android_luajit.sh
      - name: Verify ELF machine, 16 KB alignment and exports
        run: python3 -I Test/Native/check_android_elf.py build/plugin_luajit/Plugins/Android/libs/*/libxlua.so
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: |
            ./build/plugin_luajit/**/*
            !./build/plugin_luajit/symbols/**
          name: plugin_luajit_android
      - name: Upload the LuaJIT symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/symbols/
          name: android-symbols-luajit
          if-no-files-found: error

  ohos:
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OpenHarmony native SDK
        run: .github/scripts/install-ohos-sdk.sh
      - name: Build
        run: |
          cd build
          ./make_ohos_lua55.sh
          ./make_ohos_lua54.sh
          ./make_ohos_lua53.sh
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_ohos
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_ohos
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_ohos

  linux:
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd build
          ./make_linux_lua55.sh
          ./make_linux_lua54.sh
          ./make_linux64_lua53.sh
          ./make_linux64_luajit.sh
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_linux
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_linux
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_linux
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_linux

  ios:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd build
          ./make_ios_lua55.sh
          ./make_ios_lua54.sh
          ./make_ios_lua53.sh
          ./make_ios_luajit.sh
          # The arm64 simulator libraries, as the plugin variant Plugins/iOS/xlua-variants/simulator/
          # that the selector takes for a Target SDK = Simulator SDK build. LuaJIT has none.
          XLUA_IOS_SDK=simulator ./make_ios_lua55.sh
          XLUA_IOS_SDK=simulator ./make_ios_lua54.sh
          XLUA_IOS_SDK=simulator ./make_ios_lua53.sh
          # Lua 5.5.1's minimal and core variants, for devices and the simulator (minimal_simulator,
          # core_simulator), as the UPM package carries them.
          XLUA_VARIANT=minimal XLUA_PRESET=minimal ./make_ios_lua55.sh
          XLUA_IOS_SDK=simulator XLUA_VARIANT=minimal XLUA_PRESET=minimal ./make_ios_lua55.sh
          XLUA_VARIANT=core XLUA_PRESET=core ./make_ios_lua55.sh
          XLUA_IOS_SDK=simulator XLUA_VARIANT=core XLUA_PRESET=core ./make_ios_lua55.sh
      - name: Check the deployment target
        # Fails when a library needs a newer iOS than 15.0 (build/README.md), or a simulator
        # library is not built for the simulator.
        run: |
          python3 Test/Native/check_apple_minos.py --platform ios build/plugin_*/Plugins/iOS/libxlua.a \
            build/plugin_lua55/Plugins/iOS/xlua-variants/minimal/libxlua.a build/plugin_lua55/Plugins/iOS/xlua-variants/core/libxlua.a
          python3 Test/Native/check_apple_minos.py --platform iossimulator build/plugin_lua5*/Plugins/iOS/xlua-variants/simulator/libxlua.a \
            build/plugin_lua55/Plugins/iOS/xlua-variants/minimal_simulator/libxlua.a build/plugin_lua55/Plugins/iOS/xlua-variants/core_simulator/libxlua.a
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_ios
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_ios
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_ios
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_ios

  osx:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd build
          ./make_osx_lua55.sh
          ./make_osx_lua54.sh
          ./make_osx_lua53.sh
          ./make_osx_luajit.sh
          ./make_osx_silicon_lua55.sh
          ./make_osx_silicon_lua53.sh
          ./make_osx_silicon_lua54.sh
      - name: Check the deployment target
        # Fails when a plugin needs a newer macOS than 12.0 (build/README.md).
        run: python3 Test/Native/check_apple_minos.py --platform macos build/plugin_*/Plugins/xlua.bundle/Contents/MacOS/xlua build/plugin_*/Plugins/arm64/libxlua.dylib
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_osx
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_osx
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_osx
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_osx

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSVC
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Build
        # As in build.yml: the scripts stop with exit code 1 at the first failed step and skip
        # pause when CI is set. make_win64_luajit.bat opens its own x64 developer prompt.
        shell: cmd # zizmor: ignore[misfeature] the build scripts are .bat files
        run: |
          call build\make_win_lua55.bat || exit /b 1
          call build\make_win_lua54.bat || exit /b 1
          call build\make_win32_lua53.bat || exit /b 1
          call build\make_win64_lua53.bat || exit /b 1
          call build\make_win64_luajit.bat || exit /b 1
      - name: Build UWP (needs Visual Studio 2019)
        # make_uwp*.bat ask for the Visual Studio 2019 generator, which windows-2022 lacks, and
        # go on after a failed step: they produce no WSA libraries here (docs/design/release.md).
        run: |
          cd build
          .\make_uwp_lua55.bat
          .\make_uwp_lua54.bat
          .\make_uwp.bat
      - name: Check that every library was built
        # The UPM package needs the two Lua 5.5.1 libraries (make_upm_package.py --release);
        # the others go into the runtime archives. The UWP (WSA) libraries are not checked.
        shell: bash
        run: |
          set -euo pipefail
          ls -l build/plugin_lua55/Plugins/x86_64/xlua.dll build/plugin_lua55/Plugins/x86/xlua.dll \
            build/plugin_lua54/Plugins/x86_64/xlua.dll build/plugin_lua54/Plugins/x86/xlua.dll \
            build/plugin_lua53/Plugins/x86_64/xlua.dll build/plugin_lua53/Plugins/x86/xlua.dll \
            build/plugin_luajit/Plugins/x86_64/xlua.dll
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_window
          if-no-files-found: error
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_window
          if-no-files-found: error
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_window
          if-no-files-found: error
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_window
          if-no-files-found: error

  windows-luajit-32:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSVC
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Build LuaJIT
        # The script opens its own x86 developer prompt (vswhere) and stops with exit code 1
        # at the first failed step.
        shell: cmd # zizmor: ignore[misfeature] the build scripts are .bat files
        run: call build\make_win32_luajit.bat || exit /b 1
      - name: Check that the library was built
        shell: bash
        run: ls -l build/plugin_luajit/Plugins/x86/xlua.dll
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_window32
          if-no-files-found: error

  windows-arm64:
    needs: version
    # Native Windows on Arm. The scripts also cross-compile on windows-2022 (x64).
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: cmd # zizmor: ignore[misfeature] the build scripts are .bat files
        run: |
          call build\make_win_arm64_lua55.bat || exit /b 1
          call build\make_win_arm64_lua54.bat || exit /b 1
          call build\make_win_arm64_lua53.bat || exit /b 1
          call build\make_win_arm64_luajit.bat || exit /b 1
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_window_arm64
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_window_arm64
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_window_arm64
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_window_arm64

  # The UPM package: the Lua 5.5.1 plugins of every platform the package ships (OpenHarmony is
  # not one: Assets/Plugins has no import settings for it), the source generator and the
  # repository's C#, assembled and linted by make_upm_package.py --release. Assembled a second
  # time with a fresh generator build, it must give the same bytes.
  upm:
    needs: [version, android, ios, osx, linux, windows, windows-arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The source generator builds with the .NET SDK of mise.toml.
      - name: Install the .NET SDK (mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # A mise release past the seven-day window; Renovate bumps it.
          version: 2026.10.4
          install_args: dotnet
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_lua55_*
          path: plugins/
      - name: Assemble the package
        run: |
          set -euo pipefail
          # Every platform's artifact but OpenHarmony's, each a folder with Plugins/ inside.
          args=()
          for dir in plugins/plugin_lua55_*; do
            if [[ "$dir" == *_ohos ]]; then continue; fi
            args+=(--plugins "$dir")
          done
          tgz="dist/com.xlua-ng.xlua-$VERSION.tgz"
          python3 -I Tools/make_upm_package.py --release --version "$VERSION" --output "$RUNNER_TEMP/package" \
            --source-gen "$RUNNER_TEMP/sourcegen" --tarball "$tgz" "${args[@]}"
          python3 -I Tools/make_upm_package.py --release --version "$VERSION" --output "$RUNNER_TEMP/package-again" \
            --source-gen "$RUNNER_TEMP/sourcegen-again" --tarball "$RUNNER_TEMP/again.tgz" "${args[@]}"
          # The same plugins, sources and generator sources must give the same tarball.
          cmp "$tgz" "$RUNNER_TEMP/again.tgz"
          sha256sum "$tgz" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/
          name: upm-package
          if-no-files-found: error

  # XLuaHotfixInject and the other command-line tools (Tools/build_tools.py), which a project
  # that uses hotfix needs in its Tools/ folder; the package does not contain them.
  tools:
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Mono
        # The Homebrew bottle the managed tests use (Mono 6.14.1).
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mono
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build the tools
        # Mono.Cecil comes from nuget.org, checked against its pinned SHA-512.
        run: python3 -I Tools/build_tools.py --output "$RUNNER_TEMP/tools/Tools" --cache "$RUNNER_TEMP/tools-cache"
      - name: Upload the tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/tools/
          name: xlua-tools
          if-no-files-found: error

  # Rebuild Lua 5.5.1's plugins on other runners, in the same checkout path, and compare them with
  # the release build. A difference warns and fails only this job (continue-on-error), so the
  # release goes on; the job summary lists every file (docs/design/release.md).
  reproducibility-linux:
    needs: [android, linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NDK
        run: .github/scripts/install-android-ndk.sh
      - name: Build again
        run: |
          cd build
          ./make_android_lua55.sh
          XLUA_VARIANT=minimal XLUA_PRESET=minimal ./make_android_lua55.sh
          XLUA_VARIANT=core XLUA_PRESET=core ./make_android_lua55.sh
          ./make_linux_lua55.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_lua55_{android,linux}
          path: reference/
          merge-multiple: true
      - name: Compare
        run: .github/scripts/compare-builds.sh reference/Plugins build/plugin_lua55/Plugins

  reproducibility-apple:
    needs: [ios, osx]
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build again
        run: |
          cd build
          ./make_osx_lua55.sh
          ./make_osx_silicon_lua55.sh
          ./make_ios_lua55.sh
          XLUA_IOS_SDK=simulator ./make_ios_lua55.sh
          XLUA_VARIANT=minimal XLUA_PRESET=minimal ./make_ios_lua55.sh
          XLUA_IOS_SDK=simulator XLUA_VARIANT=minimal XLUA_PRESET=minimal ./make_ios_lua55.sh
          XLUA_VARIANT=core XLUA_PRESET=core ./make_ios_lua55.sh
          XLUA_IOS_SDK=simulator XLUA_VARIANT=core XLUA_PRESET=core ./make_ios_lua55.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_lua55_{ios,osx}
          path: reference/
          merge-multiple: true
      - name: Compare
        # Info.plist of the macOS bundle comes from the repository, not from the build.
        run: |
          rm -f reference/Plugins/xlua.bundle/Contents/Info.plist
          .github/scripts/compare-builds.sh reference/Plugins build/plugin_lua55/Plugins

  # Every release file, with SHA256SUMS.txt, as one artifact; the release and upm-branch jobs
  # take them from here. Runs in every run, so a run without `release` checks the same steps.
  assemble:
    runs-on: ubuntu-26.04
    needs: [version, upm, tools, windows, windows-arm64, osx, ios, android, windows-luajit-32, ohos, android_luajit, linux]
    timeout-minutes: 15
    env:
      TAG_NAME: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # For sbom.cdx.json, CHANGELOG.md and the commit time used as the archive timestamp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_luajit_*
          path: plugin_luajit/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_lua53_*
          path: plugin_lua53/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_lua54_*
          path: plugin_lua54/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin_lua55_*
          path: plugin_lua55/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-symbols-*
          path: android-symbols/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upm-package
          path: upm/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xlua-tools
          path: tools/

      - name: Create the release files
        run: |
          set -euo pipefail
          # Archive bytes depend only on the files: fixed order, owner, permissions and
          # timestamp (the commit time), and no gzip name/time.
          epoch="$(git -C source log -1 --format=%ct)"
          archive() { # archive OUT.tgz DIR PATH...
            local out="$1" dir="$2"; shift 2
            tar --sort=name --owner=0 --group=0 --numeric-owner --mode=u+rwX,go+rX,go-w \
                --mtime="@$epoch" -C "$dir" -cf - "$@" | gzip -9n > "$out"
          }
          package() {
            # The plugins of each runtime for the Assets layout (Plugins/ over Assets/Plugins).
            for flavor in luajit lua53 lua54 lua55; do
              archive "$1/${flavor}_${TAG_NAME}.tgz" "plugin_${flavor}" Plugins
            done
            # The linked Android libraries with their symbols, one folder per runtime
            # (android-symbols-lua55/Android/libs/<abi>/libxlua.so), for ndk-stack and the Play Console.
            archive "$1/android-symbols_${TAG_NAME}.tgz" android-symbols .
            # The hotfix injector and the other tools: extract into the project folder (Tools/).
            archive "$1/xlua-tools_${TAG_NAME}.tgz" tools Tools
          }
          mkdir -p assets again
          package assets
          cp "upm/com.xlua-ng.xlua-$VERSION.tgz" source/sbom.cdx.json assets/
          (cd assets && sha256sum ./*.tgz sbom.cdx.json > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Packaging the same files again must give the same checksums.
          package again
          (cd again && sha256sum ./*_"${TAG_NAME}".tgz) | diff - <(cd assets && sha256sum ./*_"${TAG_NAME}".tgz)
          # The release notes: this version's section of CHANGELOG.md.
          awk -v heading="## $VERSION" 'index($0, heading) == 1 { on = 1; next } on && /^## / { exit } on { print }' \
            source/CHANGELOG.md > assets/release-notes.md
          { echo "### SHA256SUMS.txt"; echo '```'; cat assets/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: assets/
          name: release-files
          if-no-files-found: error

  release:
    if: inputs.release
    needs: [version, assemble]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Passed through the environment, never interpolated into scripts.
      TAG_NAME: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: assets/
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          if [[ "$DRAFT" == true ]]; then flags+=(--draft); fi
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "xLua-NG $VERSION" \
            --notes-file assets/release-notes.md \
            "${flags[@]}" \
            assets/*.tgz assets/sbom.cdx.json assets/SHA256SUMS.txt

  # The git URL install (https://github.com/<owner>/xlua-ng.git#upm): the package's files at the
  # root of the branch `upm`, one commit per version on top of the last (no force push), and the
  # tag upm/v<VERSION> on it for pinned installs. Neither ref is covered by the rulesets (main
  # and v* tags), so this job alone gets contents: write for the push. Run with `release` too, it
  # pushes this run's package; alone, the package of the published release v<VERSION>, so the
  # branch holds the bytes of the release file (a rebuild differs: MSVC timestamps its DLLs).
  upm-branch:
    needs: [version, assemble, release]
    # release is skipped in an upm_branch-only run; run anyway when it did not fail.
    if: ${{ always() && inputs.upm_branch && needs.assemble.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: assets/
      - name: Take the published release's package
        if: ${{ !inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="com.xlua-ng.xlua-$VERSION.tgz"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$name" --pattern SHA256SUMS.txt --dir published
          (cd published && grep -E "  (\./)?$name\$" SHA256SUMS.txt | sha256sum --check --strict -)
          cp "published/$name" "assets/$name"
      - name: Push the package to the upm branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tag="upm/v$VERSION"
          mkdir upm
          tar -xzf "assets/com.xlua-ng.xlua-$VERSION.tgz" -C upm --strip-components=1
          cd upm
          git init -q -b upm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code "$remote" "refs/tags/$tag" >/dev/null; then
            echo "::error::the tag $tag exists"
            exit 1
          fi
          # On top of the last version, so the push is a fast-forward; the first one is an orphan.
          if git fetch -q --depth=1 "$remote" refs/heads/upm:refs/remotes/origin/upm; then
            git reset -q --soft origin/upm
          fi
          git add -A
          git commit -q -m "com.xlua-ng.xlua $VERSION" -m "The UPM package of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA, built by run $GITHUB_RUN_ID."
          git tag -a "$tag" -m "com.xlua-ng.xlua $VERSION"
          git push "$remote" HEAD:refs/heads/upm "refs/tags/$tag"
          echo "Pushed $(git rev-parse HEAD) to upm and $tag" >> "$GITHUB_STEP_SUMMARY"
