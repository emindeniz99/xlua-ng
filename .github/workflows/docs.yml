name: docs

# Manual only while the repository is private: hosted runner minutes are billed.
# When the repository is public, restore the original trigger:
# on:
#   push:
#     branches: [main]
#     paths:
#       - README.md
#       - CONTRIBUTING.md
#       - docs/**
#       - Assets/XLua/Doc/**
#       - Assets/XLua/CHANGELOG.txt
#       - mise.toml
#       - .github/workflows/docs.yml
# Set Settings > Pages > Source to "GitHub Actions" before the first deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads Node.js from mise.toml and pnpm from docs/source/package.json.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # A mise release past the seven-day window; Renovate bumps it.
          version: 2026.10.4
          working_directory: docs/source
          install_args: node pnpm
          cache: false
      - name: Install
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Check
        run: mise exec -- pnpm run check
      - name: Build
        run: mise exec -- pnpm run build
      - name: Check built links
        run: mise exec -- pnpm run links
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/source/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact to GitHub Pages
      id-token: write # let deploy-pages verify the deployment source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
