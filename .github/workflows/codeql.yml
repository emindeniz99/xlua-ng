name: CodeQL

# Pushes and pull requests that change only documentation (Markdown, docs/, the guides in
# Assets/XLua/Doc) skip the analysis: it reads C, C++ and C# only. The weekly run covers
# everything.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'Assets/XLua/Doc/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'Assets/XLua/Doc/**']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      upload:
        description: Upload results to code scanning (push, pull request and schedule runs always upload)
        type: boolean
        default: false

permissions: {}

# A new push to a pull request cancels its older analysis; runs on main are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      actions: read # the analyze action reads this workflow run
      contents: read # check out the repository
      security-events: write # upload the CodeQL results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # C/C++ is traced through a manual libxlua build. The vendored Lua,
          # LuaJIT headers and LuaSocket are compiled too; their results are
          # dropped before the upload (codeql-drop-vendored.py) but stay in the
          # artifact. They are upstream code: record them, do not patch them.
          - language: c-cpp
            build-mode: manual
            # Trail of Bits' security queries for C/C++ (not its crypto suite: no
            # OpenSSL here), pinned to a published version; see "CodeQL" in
            # .github/CI.md. The digest is checked in the step before init.
            packs: trailofbits/cpp-queries@0.3.0:codeql-suites/tob-cpp-security.qls
            pack-digest: sha256:126366bdcadbc91f0d17ce837267c734dce39af1b8f7ab233f293cbe6e4d56e5
          - language: csharp
            build-mode: none
            packs: ''
            pack-digest: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the query pack's registry digest
        if: matrix.pack-digest != ''
        # The CodeQL CLI pins packs by version only, and a registry tag can be
        # pushed again. Fail if trailofbits/cpp-queries@0.3.0 is no longer the
        # manifest recorded above (GHCR, anonymous pull token).
        env:
          WANT: ${{ matrix.pack-digest }}
        run: |
          set -euo pipefail
          token=$(curl -fsS 'https://ghcr.io/token?scope=repository:trailofbits/cpp-queries:pull' |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          got=$(curl -fsSI -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            https://ghcr.io/v2/trailofbits/cpp-queries/manifests/0.3.0 |
            tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}')
          echo "trailofbits/cpp-queries@0.3.0: $got"
          [ "$got" = "$WANT" ] || { echo "::error::expected $WANT"; exit 1; }
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds lower-precision and lower-severity security queries to
          # the default suite (owner decision Q67, 2026-10-28).
          queries: security-extended
          packs: ${{ matrix.packs }}
      - name: Build libxlua for each Lua version
        if: matrix.language == 'c-cpp'
        # Each runtime selects different #if branches in xlua_core.c, xlua.c and i64lib.c.
        run: |
          set -euo pipefail
          for lua in 5.3.6 5.4.9 5.5.1; do
            cmake -S build -B "$RUNNER_TEMP/xlua-$lua" -DCMAKE_BUILD_TYPE=Release -DLUA_VERSION="$lua"
            cmake --build "$RUNNER_TEMP/xlua-$lua" --parallel 4
          done
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          # The upload step below sends the results without vendored code; the
          # unfiltered SARIF is kept as an artifact.
          upload: never
          output: ${{ runner.temp }}/codeql-sarif
      - name: Drop results in vendored code
        run: python3 .github/scripts/codeql-drop-vendored.py "$RUNNER_TEMP/codeql-sarif" "$RUNNER_TEMP/codeql-upload"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # Manual runs upload only when asked.
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        with:
          sarif_file: ${{ runner.temp }}/codeql-upload
          category: /language:${{ matrix.language }}
      - name: Summarise the results
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/codeql-sarif" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          from collections import Counter
          rules = Counter()
          files = Counter()
          for f in pathlib.Path(sys.argv[1]).glob("*.sarif"):
              for run in json.loads(f.read_text())["runs"]:
                  for r in run.get("results", []):
                      rules[r.get("ruleId", "?")] += 1
                      loc = r.get("locations", [{}])[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "?")
                      files[loc.split("/")[0] if "/" in loc else loc] += 1
          print(f"### CodeQL: {sum(rules.values())} results")
          for rule, n in rules.most_common():
              print(f"- `{rule}`: {n}")
          print("\nBy top-level directory:")
          for d, n in files.most_common():
              print(f"- `{d}`: {n}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: ${{ runner.temp }}/codeql-sarif
          retention-days: 14
