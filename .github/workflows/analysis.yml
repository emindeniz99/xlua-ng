name: Native analysis (clang-tidy, coverage, fuzzing, Lua and LuaJIT test suites)

# The coverage job also runs on pushes to main and on pull requests that change the native
# sources, its scripts (and the Mono installer it uses) or this file (owner decision
# 2026-10-28, Test/README.md "Coverage gate"). The other jobs run by hand only.
on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'Test/Native/coverage.sh'
      - 'Test/Native/coverage_gate.py'
      - '.github/scripts/mono.sh'
      - '.github/workflows/analysis.yml'
  pull_request:
    paths:
      - 'build/**'
      - 'Test/Native/coverage.sh'
      - 'Test/Native/coverage_gate.py'
      - '.github/scripts/mono.sh'
      - '.github/workflows/analysis.yml'
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: Seconds to run each libFuzzer target
        type: number
        default: 300

permissions: {}

# A new push to a pull request cancels its older run; runs on main are kept. Manual runs get
# a group of their own (the run id), so they are neither cancelled nor queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-tidy:
    name: clang-tidy + clang --analyze
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-tidy
      - name: Analyze xLua's C files for Lua 5.3.6, 5.4.9, 5.5.1 and LuaJIT
        run: Test/Native/analyze.sh "$RUNNER_TEMP/analyze"
      - name: Upload analysis logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-tidy-logs
          path: ${{ runner.temp }}/analyze/*/clang-*.log
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: coverage (managed suite + native checks)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start installing the managed test tools
        # Same Homebrew bottle as native-build.yml; run_managed.py requires Mono 6.14.1.
        run: .github/scripts/mono.sh start
      - name: Install Clang and LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm
      - name: Wait for the managed test tools
        run: .github/scripts/mono.sh wait
      - name: Measure coverage for Lua 5.3.6, 5.4.9 and 5.5.1
        # Fails when a file's branch coverage is below coverage.sh's MIN_BRANCH_COVERAGE
        # (xlua.c=100 xlua_core.c=98 xlua_core_limits.c=93, Test/README.md); the reports are
        # uploaded either way.
        run: Test/Native/coverage.sh "$RUNNER_TEMP/coverage"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/coverage/*/report.txt
            ${{ runner.temp }}/coverage/*/functions.txt
            ${{ runner.temp }}/coverage/*/branches.txt
            ${{ runner.temp }}/coverage/*/summary.json
            ${{ runner.temp }}/coverage/*/html
          if-no-files-found: warn
          retention-days: 7

  fuzz:
    name: libFuzzer (Lua ${{ matrix.lua }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.3.6', '5.4.9', '5.5.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang with sanitizer and libFuzzer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-dev
      - name: Run each fuzz target
        env:
          FUZZ_SECONDS: ${{ inputs.fuzz-seconds }}
          FUZZ_OUT: ${{ runner.temp }}/fuzz
          LUA_VERSION: ${{ matrix.lua }}
        run: Test/Fuzz/run.sh "$FUZZ_SECONDS"
      - name: Upload crash reproducers and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-lua-${{ matrix.lua }}
          path: |
            ${{ runner.temp }}/fuzz/*/fuzz.log
            ${{ runner.temp }}/fuzz/*/crash-*
            ${{ runner.temp }}/fuzz/*/timeout-*
            ${{ runner.temp }}/fuzz/*/oom-*
          if-no-files-found: warn
          retention-days: 7

  lua-tests:
    name: Lua test suite (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lua 5.3.6
            lua: '5.3.6'
            compat: false
            artifact: lua-tests-5.3.6
          - name: Lua 5.3.6, LUAC_COMPATIBLE_FORMAT
            lua: '5.3.6'
            compat: true
            artifact: lua-tests-5.3.6-compatible-format
          - name: Lua 5.4.9
            lua: '5.4.9'
            compat: false
            artifact: lua-tests-5.4.9
          - name: Lua 5.5.1
            lua: '5.5.1'
            compat: false
            artifact: lua-tests-5.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install readline for the stand-alone interpreter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreadline-dev
      - name: Run lua.org's basic, complete and internal tests
        # Downloads the suite pinned in lua_tests.py and checks its SHA-256.
        env:
          LUA_VERSION: ${{ matrix.lua }}
          COMPAT: ${{ matrix.compat }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$COMPAT" == true ]]; then extra=(--compatible-format); fi
          python3 Test/Native/lua_tests.py --output "$RUNNER_TEMP/lua-tests" --versions "$LUA_VERSION" "${extra[@]}"
      - name: Run them again under ASan and UBSan
        env:
          LUA_VERSION: ${{ matrix.lua }}
          COMPAT: ${{ matrix.compat }}
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          extra=()
          if [[ "$COMPAT" == true ]]; then extra=(--compatible-format); fi
          python3 Test/Native/lua_tests.py --output "$RUNNER_TEMP/lua-tests-asan" --versions "$LUA_VERSION" \
            --archives "$RUNNER_TEMP/lua-tests/archives" --sanitize address,undefined --build-type RelWithDebInfo "${extra[@]}"
      - name: Upload suite logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/lua-tests*/*/*.log
          if-no-files-found: warn
          retention-days: 7

  luajit-tests:
    name: LuaJIT test suite (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64: also the nx sysmalloc build, which needs a real x86-64 address space.
          - name: Linux x86_64
            runner: ubuntu-26.04
            artifact: luajit-tests-linux-x64
          - name: macOS arm64
            runner: macos-26
            artifact: luajit-tests-macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run LuaJIT-test-cleanup in every mode this runner can build
        # Downloads the suite commit pinned in luajit_tests.py and checks its
        # SHA-256; builds build/luajit-2.1 with LuaJIT's Makefile per mode.
        run: python3 Test/Native/luajit_tests.py --output "$RUNNER_TEMP/luajit-tests"
      - name: Upload results and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/luajit-tests/*/*.log
            ${{ runner.temp }}/luajit-tests/*/results.tsv
            ${{ runner.temp }}/luajit-tests/*/standalone/*.log
          if-no-files-found: warn
          retention-days: 7
