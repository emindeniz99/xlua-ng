name: build

on:
  push:
    # The build scripts and what the jobs run besides them: the NDK and OpenHarmony SDK
    # installers, the x86 Python finder and the checks of the Android, Apple, OpenHarmony and Windows libraries
    # (the native regressions with the modules and cases they read).
    paths:
      - build/**
      - .github/scripts/install-android-ndk.sh
      - .github/scripts/install-ohos-sdk.sh
      - .github/scripts/find-python-x86.sh
      - Test/Native/check_android_elf.py
      - Test/Native/check_apple_minos.py
      - Test/Native/check_exports.py
      - Test/Native/native_regression.py
      - Test/Native/profiler_smoke.py
      - Test/Native/core_regression.py
      - Test/Native/core_sandbox_cases.txt
      - Test/Native/stop_latency.py
      - Test/Native/bytecode_only.py
      - Test/Native/managed_imports.py
      - Test/Native/ohos_check.sh
      - Test/Native/ohos_x86_64_entry.c
      - Test/Native/plugin_smoke.c
      - Tools/presets.py
      - Assets/XLua/Src/**
      - Assets/XLua/Core/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NDK
        run: .github/scripts/install-android-ndk.sh
      - name: Build
        run: |
          cd build
          ./make_android_lua55.sh
          ./make_android_lua54.sh
          ./make_android_lua53.sh
      - name: Verify ELF machine, 16 KB alignment and exports
        run: python3 -I Test/Native/check_android_elf.py build/plugin_lua5*/Plugins/Android/libs/*/libxlua.so
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_android
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_android
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_android

  android_luajit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NDK
        run: .github/scripts/install-android-ndk.sh
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          cd build
          ./make_android_luajit.sh
      - name: Verify ELF machine, 16 KB alignment and exports
        run: python3 -I Test/Native/check_android_elf.py build/plugin_luajit/Plugins/Android/libs/*/libxlua.so
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_android

  ohos:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OpenHarmony native SDK
        run: .github/scripts/install-ohos-sdk.sh
      - name: Build
        run: |
          cd build
          ./make_ohos_lua55.sh
          ./make_ohos_lua54.sh
          ./make_ohos_lua53.sh
      - name: Run the plugin smoke test (static build; arm64 through qemu-user)
        # armeabi-v7a is built but not run: a static OpenHarmony hello world
        # already stops with SIGILL under qemu-arm.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          ABIS="x86_64 arm64-v8a" Test/Native/ohos_check.sh "$OHOS_NDK_HOME" "$RUNNER_TEMP/ohos-check"
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_ohos
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_ohos
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_ohos

  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd build
          ./make_linux_lua55.sh
          ./make_linux_lua54.sh
          ./make_linux64_lua53.sh
          ./make_linux64_luajit.sh
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_linux
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_linux
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_linux
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_linux

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd build
          ./make_ios_lua55.sh
          ./make_ios_lua54.sh
          ./make_ios_lua53.sh
          ./make_ios_luajit.sh
      - name: Check the deployment target
        # Fails when a library needs a newer iOS than 15.0 (build/README.md).
        run: python3 Test/Native/check_apple_minos.py --platform ios build/plugin_*/Plugins/iOS/libxlua.a
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_ios
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_ios
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_ios
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_ios

  osx:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd build
          ./make_osx_lua55.sh
          ./make_osx_lua54.sh
          ./make_osx_lua53.sh
          ./make_osx_luajit.sh
          ./make_osx_silicon_lua55.sh
          ./make_osx_silicon_lua53.sh
          ./make_osx_silicon_lua54.sh
      - name: Check the deployment target
        # Fails when a plugin needs a newer macOS than 12.0 (build/README.md).
        run: python3 Test/Native/check_apple_minos.py --platform macos build/plugin_*/Plugins/xlua.bundle/Contents/MacOS/xlua build/plugin_*/Plugins/arm64/libxlua.dylib
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_osx
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_osx
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_osx
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_osx

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSVC
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Build
        # The scripts stop with exit code 1 at the first failed step and skip pause when CI
        # is set. make_win64_luajit.bat opens its own x64 developer prompt (vswhere).
        shell: cmd # zizmor: ignore[misfeature] the build scripts are .bat files
        run: |
          call build\make_win_lua55.bat || exit /b 1
          call build\make_win_lua54.bat || exit /b 1
          call build\make_win32_lua53.bat || exit /b 1
          call build\make_win64_lua53.bat || exit /b 1
          call build\make_win64_luajit.bat || exit /b 1
      - name: Build UWP (needs Visual Studio 2019)
        # make_uwp*.bat ask for the Visual Studio 2019 generator, which windows-2022 lacks, and
        # go on after a failed step: they produce no WSA libraries here (docs/design/release.md).
        run: |
          cd build
          .\make_uwp_lua55.bat
          .\make_uwp_lua54.bat
          .\make_uwp.bat
      - name: Check that every library was built
        shell: bash
        run: |
          set -euo pipefail
          ls -l build/plugin_lua55/Plugins/x86_64/xlua.dll build/plugin_lua55/Plugins/x86/xlua.dll \
            build/plugin_lua54/Plugins/x86_64/xlua.dll build/plugin_lua54/Plugins/x86/xlua.dll \
            build/plugin_lua53/Plugins/x86_64/xlua.dll build/plugin_lua53/Plugins/x86/xlua.dll \
            build/plugin_luajit/Plugins/x86_64/xlua.dll
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_window
          if-no-files-found: error
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_window
          if-no-files-found: error
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_window
          if-no-files-found: error
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_window
          if-no-files-found: error
      - name: Check the x64 exports and run the native regressions
        # As in windows-host.yml: the stop-latency checks allow 250 ms on hosted runners and
        # retry a failed one once.
        timeout-minutes: 15
        shell: bash
        env:
          XLUA_STOP_SLACK_MS: '250'
          XLUA_RETRY_STOP_LATENCY: '1'
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          for lua in lua55 lua54 lua53 luajit; do
            plugin="build/plugin_$lua/Plugins/x86_64/xlua.dll"
            echo "::group::$plugin"
            python Test/Native/check_exports.py "$plugin"
            if [[ "$lua" != luajit ]]; then python Test/Native/profiler_smoke.py "$plugin"; fi
            python Test/Native/native_regression.py "$plugin"
            echo "::endgroup::"
          done
      - name: Check the x86 exports
        # ctypes loads an x86 DLL only from a 32-bit Python; the runner's tool cache has one.
        shell: bash
        run: |
          set -euo pipefail
          py="$(bash .github/scripts/find-python-x86.sh)"
          for lua in lua55 lua54 lua53; do
            "$py" Test/Native/check_exports.py "build/plugin_$lua/Plugins/x86/xlua.dll"
          done

  windows-luajit-32:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSVC
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Build LuaJIT
        # The script opens its own x86 developer prompt (vswhere) and stops with exit code 1
        # at the first failed step.
        shell: cmd # zizmor: ignore[misfeature] the build scripts are .bat files
        run: call build\make_win32_luajit.bat || exit /b 1
      - name: Check that the library was built
        shell: bash
        run: ls -l build/plugin_luajit/Plugins/x86/xlua.dll
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_window32
          if-no-files-found: error
      - name: Check the exports
        # ctypes loads an x86 DLL only from a 32-bit Python; the runner's tool cache has one.
        shell: bash
        run: |
          set -euo pipefail
          py="$(bash .github/scripts/find-python-x86.sh)"
          "$py" Test/Native/check_exports.py build/plugin_luajit/Plugins/x86/xlua.dll

  windows-arm64:
    # Native Windows on Arm. The scripts also cross-compile on windows-2022 (x64).
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: cmd # zizmor: ignore[misfeature] the build scripts are .bat files
        run: |
          call build\make_win_arm64_lua55.bat || exit /b 1
          call build\make_win_arm64_lua54.bat || exit /b 1
          call build\make_win_arm64_lua53.bat || exit /b 1
          call build\make_win_arm64_luajit.bat || exit /b 1
      - name: Upload55
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua55/**/*
          name: plugin_lua55_window_arm64
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua54/**/*
          name: plugin_lua54_window_arm64
      - name: Upload53
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_lua53/**/*
          name: plugin_lua53_window_arm64
      - name: UploadJit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./build/plugin_luajit/**/*
          name: plugin_luajit_window_arm64
