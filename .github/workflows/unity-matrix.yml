name: Unity editor matrix

# Manual only while the repository is private: hosted runner minutes are billed.
# When the repository is public, add these triggers back under `on:`:
#   schedule:
#     - cron: "0 4 * * 1"
#   push:
#     branches: [main]
#     paths:
#       - "Assets/XLua/Src/**"
#       - "Test/**"
#       - "build/**"
#       - ".github/workflows/unity-matrix.yml"
#   pull_request:
#     paths:
#       - "Assets/XLua/Src/**"
#       - "Test/**"
#       - "build/**"
#       - ".github/workflows/unity-matrix.yml"
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license:
    name: Check Unity license configuration
    runs-on: ubuntu-26.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "::notice::Unity tests skipped because fork pull requests cannot receive repository secrets."
            else
              echo "::error::UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD are required for real Unity CI."
              exit 1
            fi
          fi

  editor:
    name: Unity ${{ matrix.name }} editor test
    needs: license
    if: needs.license.outputs.available == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.UNITY_MAX_PARALLEL || '2') }}
      # Free (Personal licence) releases only: 2021.3 and 2022.3 patches after
      # these are paid Extended LTS. Digests are the ubuntu-<version>-base-3.2.2
      # tags, resolved 2026-10-15.
      matrix:
        include:
          - name: "2021.3 LTS"
            unity-version: 2021.3.45f2
            test-framework: 1.1.33
            editor-image: unityci/editor@sha256:d2bf0b5f48594c0f8d5a743de4428793b1cde51375890087e6b48e45bca22cc1
          - name: "2022.3 LTS"
            unity-version: 2022.3.62f3
            test-framework: 1.4.6
            editor-image: unityci/editor@sha256:5d7a21ca16b52434b3d7a761d15a48def4cc38fc41fada82145f87c5e92c09c3
          - name: "Unity 6.0 LTS"
            unity-version: 6000.0.84f1
            test-framework: 1.4.6
            editor-image: unityci/editor@sha256:fc9cf7a866dfba31f03d52f646f254181e12f6a12d0d55c44479a07753a49b83
          - name: "Unity 6.3 LTS"
            unity-version: 6000.3.26f1
            test-framework: 1.4.6
            editor-image: unityci/editor@sha256:cb752900380168fe2eab0a1aef7178f4dd00a0bf2febac59fab0bdff202a38ad
          - name: "Unity 6.6 latest"
            unity-version: 6000.6.6f1
            test-framework: 1.4.6
            editor-image: unityci/editor@sha256:cad44cfb7dd2e7b432214f5aa6bfb99c3f63b54d24d9c788998df13452b1bb83
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the Unity image
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
          df -h /

      - name: Build Lua 5.5.1 Linux plugin
        run: |
          set -euxo pipefail
          cmake -S build -B "$RUNNER_TEMP/xlua-native" -DLUA_VERSION=5.5.1 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/xlua-native" --config Release --parallel 4
          test -f "$RUNNER_TEMP/xlua-native/libxlua.so"

      - name: Prepare disposable Unity project
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
          TEST_FRAMEWORK: ${{ matrix.test-framework }}
        run: |
          python3 Test/UnityMatrix/prepare.py \
            --output "$GITHUB_WORKSPACE/ci-unity-project" \
            --plugin "$RUNNER_TEMP/xlua-native/libxlua.so" \
            --unity-version "$UNITY_VERSION" \
            --test-framework "$TEST_FRAMEWORK" \
            --platform linux \
            --editor-tools

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-unity-project/Library
          key: Library-unity-${{ matrix.unity-version }}-${{ hashFiles('ci-unity-project/Packages/**', 'ci-unity-project/ProjectSettings/**', 'Assets/XLua/Src/**', 'Test/UnityMatrix/**') }}
          restore-keys: |
            Library-unity-${{ matrix.unity-version }}-

      - name: Run EditMode smoke test
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ matrix.unity-version }}
          customImage: ${{ matrix.editor-image }}
          projectPath: ci-unity-project
          testMode: EditMode
          checkName: unity tests (${{ matrix.unity-version }})
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: ci-unity-project/artifacts

      - name: Make test results readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ci-unity-project/artifacts || true

      - name: Upload Unity test artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-${{ matrix.unity-version }}-results
          path: ci-unity-project/artifacts
          if-no-files-found: warn
          retention-days: 14
