name: Unity editor matrix

# Manual only while the repository is private: hosted runner minutes are billed.
# When the repository is public, add these triggers back under `on:`:
#   schedule:
#     - cron: "0 4 * * 1"
#   push:
#     branches: [main]
#     paths:
#       - "Assets/XLua/Src/**"
#       - "Test/**"
#       - "build/**"
#       - ".github/workflows/unity-matrix.yml"
#   pull_request:
#     paths:
#       - "Assets/XLua/Src/**"
#       - "Test/**"
#       - "build/**"
#       - ".github/workflows/unity-matrix.yml"
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license:
    name: Check Unity license configuration
    runs-on: ubuntu-26.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "::notice::Unity tests skipped because fork pull requests cannot receive repository secrets."
            else
              echo "::error::UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD are required for real Unity CI."
              exit 1
            fi
          fi

  editor:
    name: Unity ${{ matrix.name }} editor test
    needs: license
    if: needs.license.outputs.available == 'true'
    runs-on: ubuntu-26.04
    # Four editor launches: generate code, test, clear generated code, test.
    # The play mode tests (--fast-enter-play-mode) add domain reloads to each.
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.UNITY_MAX_PARALLEL || '2') }}
      # Free (Personal licence) releases only: 2021.3 and 2022.3 patches after
      # these are paid Extended LTS. Digests are the ubuntu-<version>-base-3.2.2
      # tags, resolved 2026-10-15.
      # Every leg prepares the project with --fast-enter-play-mode (the play
      # mode tests) and --roslyn-sdk (XluaRefReadonlyLib.dll). prepare-args
      # adds the rest: --csharp12 needs Unity 6000.6's Roslyn (C# 12), and the
      # hotfix legs compile with HOTFIX_ENABLE in the oldest and the newest
      # editor. variant keeps the cache, check and artifact names apart.
      matrix:
        include:
          - name: "2021.3 LTS"
            variant: default
            unity-version: 2021.3.45f2
            test-framework: 1.1.33
            editor-image: unityci/editor@sha256:d2bf0b5f48594c0f8d5a743de4428793b1cde51375890087e6b48e45bca22cc1
            prepare-args: ""
          - name: "2022.3 LTS"
            variant: default
            unity-version: 2022.3.62f3
            test-framework: 1.4.6
            editor-image: unityci/editor@sha256:5d7a21ca16b52434b3d7a761d15a48def4cc38fc41fada82145f87c5e92c09c3
            prepare-args: ""
          - name: "Unity 6.0 LTS"
            variant: default
            unity-version: 6000.0.84f1
            test-framework: 1.4.6
            editor-image: unityci/editor@sha256:fc9cf7a866dfba31f03d52f646f254181e12f6a12d0d55c44479a07753a49b83
            prepare-args: ""
          - name: "Unity 6.3 LTS"
            variant: default
            unity-version: 6000.3.26f1
            test-framework: 1.4.6
            editor-image: unityci/editor@sha256:cb752900380168fe2eab0a1aef7178f4dd00a0bf2febac59fab0bdff202a38ad
            prepare-args: ""
          - name: "Unity 6.6 latest"
            variant: default
            unity-version: 6000.6.6f1
            test-framework: 1.4.6
            editor-image: unityci/editor@sha256:cad44cfb7dd2e7b432214f5aa6bfb99c3f63b54d24d9c788998df13452b1bb83
            prepare-args: "--csharp12"
          - name: "2021.3 LTS, hotfix"
            variant: hotfix
            unity-version: 2021.3.45f2
            test-framework: 1.1.33
            editor-image: unityci/editor@sha256:d2bf0b5f48594c0f8d5a743de4428793b1cde51375890087e6b48e45bca22cc1
            prepare-args: "--hotfix"
          - name: "Unity 6.6 latest, hotfix"
            variant: hotfix
            unity-version: 6000.6.6f1
            test-framework: 1.4.6
            editor-image: unityci/editor@sha256:cad44cfb7dd2e7b432214f5aa6bfb99c3f63b54d24d9c788998df13452b1bb83
            prepare-args: "--hotfix --csharp12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the Unity image
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
          df -h /

      - name: Build Lua 5.5.1 Linux plugin
        run: |
          set -euxo pipefail
          cmake -S build -B "$RUNNER_TEMP/xlua-native" -DLUA_VERSION=5.5.1 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/xlua-native" --config Release --parallel 4
          test -f "$RUNNER_TEMP/xlua-native/libxlua.so"

      # prepare.py --roslyn-sdk compiles Test/UnityMatrix/XluaRefReadonlyLib.cs
      # at C# 12 against .NET Standard 2.1. The .NET SDK pinned in mise.toml
      # has a new enough Roslyn but not the NETStandard.Library.Ref 2.1.0
      # targeting pack that Unity 6000.6's DotNetSdk has. The pack comes from
      # NuGet, checked against the SHA-512 that NuGet's catalog lists. Built
      # this way the DLL's IL equals the one from Unity 6000.6's own DotNetSdk
      # (checked with monodis on 2026-10-18).
      - name: Install the .NET SDK (mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # A mise release past the seven-day window; Renovate bumps it.
          version: 2026.10.4
          install_args: dotnet
          cache: false

      - name: Add the .NET Standard 2.1 targeting pack to the SDK
        env:
          PACK_URL: https://api.nuget.org/v3-flatcontainer/netstandard.library.ref/2.1.0/netstandard.library.ref.2.1.0.nupkg
          PACK_SHA512: 26bd0eaa7aa4689246115ab7c3da0d42b204b5e0ffe1004d83760e87572f463c9dcf0a29d3bfb96968cefd27c462ee82c019fe75204a5e3f27884bd3372d9bac
        run: |
          set -euo pipefail
          sdk="$(dirname "$(mise which dotnet)")"
          nupkg="$RUNNER_TEMP/netstandard.library.ref.2.1.0.nupkg"
          curl -sSfL --retry 3 -o "$nupkg" "$PACK_URL"
          echo "$PACK_SHA512  $nupkg" | sha512sum -c -
          mkdir -p "$sdk/packs/NETStandard.Library.Ref/2.1.0"
          unzip -q "$nupkg" -d "$sdk/packs/NETStandard.Library.Ref/2.1.0"
          test -f "$sdk/packs/NETStandard.Library.Ref/2.1.0/ref/netstandard2.1/netstandard.dll"
          echo "XLUA_ROSLYN_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Prepare disposable Unity project
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
          TEST_FRAMEWORK: ${{ matrix.test-framework }}
          PREPARE_ARGS: ${{ matrix.prepare-args }}
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          set -eu
          # PREPARE_ARGS holds plain flags from the matrix, split on spaces.
          # shellcheck disable=SC2086
          python3 Test/UnityMatrix/prepare.py \
            --output "$GITHUB_WORKSPACE/ci-unity-project" \
            --plugin "$RUNNER_TEMP/xlua-native/libxlua.so" \
            --unity-version "$UNITY_VERSION" \
            --test-framework "$TEST_FRAMEWORK" \
            --platform linux \
            --editor-tools \
            --fast-enter-play-mode \
            --roslyn-sdk "$XLUA_ROSLYN_SDK" \
            $PREPARE_ARGS

      # Compiles the xLua runtime, Editor and test sources for every define
      # set of Test/Native/editor_compile_check.py with the image's own Roslyn
      # and Unity DLLs. It reads files only and starts no Unity, so it needs no
      # licence and fails in a minute or two, before the editor launches.
      # Python comes from the image's Ubuntu archive when the image has none.
      - name: Compile-check xLua against the editor's assemblies
        env:
          EDITOR_IMAGE: ${{ matrix.editor-image }}
          UNITY_VERSION: ${{ matrix.unity-version }}
        run: |
          set -eu
          docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace \
            -e UNITY_VERSION "$EDITOR_IMAGE" bash -c '
              set -eu
              if ! command -v python3 >/dev/null; then
                apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null
              fi
              python3 Test/Native/editor_compile_check.py --unity /opt/unity --unity-version "$UNITY_VERSION" \
                --compiler unity --output ci-unity-project/artifacts/editor-compile'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-unity-project/Library
          key: Library-unity-${{ matrix.unity-version }}-${{ matrix.variant }}-${{ hashFiles('ci-unity-project/Packages/**', 'ci-unity-project/ProjectSettings/**', 'Assets/XLua/Src/**', 'Test/UnityMatrix/**') }}
          restore-keys: |
            Library-unity-${{ matrix.unity-version }}-${{ matrix.variant }}-

      # The same sequence as `Test/UnityMatrix/editor_tests.py run`: generated
      # code only takes effect after Unity compiles it, so code generation and
      # the tests that check it are separate editor launches. The builder action
      # only provides a licensed `-executeMethod ... -quit` launch; it builds
      # no player.
      - name: Generate code (XLua/Generate Code)
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ matrix.unity-version }}
          customImage: ${{ matrix.editor-image }}
          projectPath: ci-unity-project
          targetPlatform: StandaloneLinux64
          buildMethod: XluaEditorTestSteps.GenerateCode
          buildsPath: ci-unity-project/artifacts/builder-generate
          versioning: None
          allowDirtyBuild: true

      - name: Run EditMode tests with generated code
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ matrix.unity-version }}
          customImage: ${{ matrix.editor-image }}
          projectPath: ci-unity-project
          testMode: EditMode
          checkName: unity tests (${{ matrix.unity-version }} ${{ matrix.variant }}, generated code)
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: ci-unity-project/artifacts/generated

      - name: Make generated-code results readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ci-unity-project || true

      - name: Check generated-code results and LuaCATS definitions with lua-language-server
        run: |
          set -eu
          python3 Test/UnityMatrix/editor_tests.py verify --mode generated --project ci-unity-project \
            --results ci-unity-project/artifacts/generated/editmode-results.xml
          python3 Test/UnityMatrix/editor_tests.py luals --project ci-unity-project \
            --out "$RUNNER_TEMP/luals" --download-luals

      - name: Clear generated code (XLua/Clear Generated Code)
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ matrix.unity-version }}
          customImage: ${{ matrix.editor-image }}
          projectPath: ci-unity-project
          targetPlatform: StandaloneLinux64
          buildMethod: XluaEditorTestSteps.ClearCode
          buildsPath: ci-unity-project/artifacts/builder-clear
          versioning: None
          allowDirtyBuild: true

      - name: Run EditMode tests after clearing generated code
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ matrix.unity-version }}
          customImage: ${{ matrix.editor-image }}
          projectPath: ci-unity-project
          testMode: EditMode
          checkName: unity tests (${{ matrix.unity-version }} ${{ matrix.variant }}, reflection)
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: ci-unity-project/artifacts/cleared

      - name: Make test results readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ci-unity-project || true

      - name: Check results after clearing generated code
        run: |
          python3 Test/UnityMatrix/editor_tests.py verify --mode cleared --project ci-unity-project \
            --results ci-unity-project/artifacts/cleared/editmode-results.xml

      - name: Upload Unity test artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-${{ matrix.unity-version }}-${{ matrix.variant }}-results
          path: ci-unity-project/artifacts
          if-no-files-found: warn
          retention-days: 14

  # Test/UnityMatrix/hotfix_il2cpp.py: an Android ARM64 IL2CPP player whose
  # Assembly-CSharp xLua's post-build step injects before IL2CPP converts it
  # (Tencent/xLua#1064, "use of undeclared label"), built from GameCI's Android
  # image in the oldest and the newest editor. The script prepares the project
  # and checks the result; the two editor launches in between are GameCI
  # unity-builder steps, which hold the licence. The build method writes every
  # message it logs to build.log (-xluaBuildLog), because the builder sends the
  # editor log to stdout. Building only, about three minutes per player; the APK
  # is not run here (Test/MobileSmoke/README.md has the emulator steps).
  hotfix-il2cpp:
    name: Unity ${{ matrix.unity-version }} hotfix Android IL2CPP build
    needs: license
    if: needs.license.outputs.available == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.UNITY_MAX_PARALLEL || '2') }}
      # ubuntu-<version>-android-3.2.2 tags, resolved 2026-10-18.
      matrix:
        include:
          - unity-version: 2021.3.45f2
            editor-image: unityci/editor@sha256:5e5c6bbd34cc65ce8cd25935bf4aa1b30aabb28e1b5aabd6faf53737b473e482
          - unity-version: 6000.6.6f1
            editor-image: unityci/editor@sha256:bbe45b1d162f8c615ad35b4b65c131b42f6e2588dd30f29d830af68d458bbc76
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the Unity image
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
          df -h /

      # build_tools.py compiles XLuaHotfixInject.exe with mcs; hotfix_check.py
      # builds ShortBranches.exe, which checks the injected IL. Same bottle as
      # native-build.yml.
      - name: Install Mono
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mono
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        run: .github/scripts/install-android-ndk.sh

      - name: Build the Lua 5.5.1 plugins and the hotfix tools
        run: |
          set -euxo pipefail
          cmake -S build -B "$RUNNER_TEMP/xlua-native" -DLUA_VERSION=5.5.1 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/xlua-native" --config Release --parallel 4
          XLUA_BUILD_ROOT="$RUNNER_TEMP/xlua-android" ANDROID_ABIS=arm64-v8a build/make_android_lua55.sh
          python3 Tools/build_tools.py
          python3 Test/Native/hotfix_check.py --plugin "$RUNNER_TEMP/xlua-native/libxlua.so" --output "$RUNNER_TEMP/hotfix-check"
          test -f "$RUNNER_TEMP/hotfix-check/tools/ShortBranches.exe"

      - name: Prepare the hotfix project
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
        run: |
          python3 Test/UnityMatrix/hotfix_il2cpp.py --prepare-only --platform linux \
            --unity-version "$UNITY_VERSION" \
            --plugin "$RUNNER_TEMP/xlua-native/libxlua.so" \
            --android-plugin "$RUNNER_TEMP/xlua-android/plugin_lua55/Plugins/Android/libs/arm64-v8a/libxlua.so" \
            --project "$GITHUB_WORKSPACE/ci-hotfix-project" --out "$GITHUB_WORKSPACE/ci-hotfix-out"

      - name: Generate code (the hotfix bridges)
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ matrix.unity-version }}
          customImage: ${{ matrix.editor-image }}
          projectPath: ci-hotfix-project
          targetPlatform: Android
          buildMethod: XluaEditorTestSteps.GenerateCode
          buildsPath: ci-hotfix-out/builder-generate
          versioning: None
          allowDirtyBuild: true

      # The builder runs the editor in a container with the workspace at
      # /github/workspace, so the paths passed to the build method are that
      # container's.
      - name: Build the Android IL2CPP player (HotfixRegionsSteps.BuildAndroid)
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ matrix.unity-version }}
          customImage: ${{ matrix.editor-image }}
          projectPath: ci-hotfix-project
          targetPlatform: Android
          buildMethod: HotfixRegionsSteps.BuildAndroid
          buildsPath: ci-hotfix-out/builder-build
          customParameters: -xluaPlayerOut /github/workspace/ci-hotfix-out/XluaHotfixRegions.apk -xluaBuildLog /github/workspace/ci-hotfix-out/build.log
          versioning: None
          allowDirtyBuild: true

      - name: Make the build output readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ci-hotfix-project ci-hotfix-out || true

      - name: Check the injection, IL2CPP's C++ and the injected IL
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
        run: |
          python3 Test/UnityMatrix/hotfix_il2cpp.py --verify-only --unity-version "$UNITY_VERSION" \
            --project "$GITHUB_WORKSPACE/ci-hotfix-project" --out "$GITHUB_WORKSPACE/ci-hotfix-out" \
            --check-tool "$RUNNER_TEMP/hotfix-check/tools/ShortBranches.exe"

      - name: Upload the build log and the injected assembly
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-${{ matrix.unity-version }}-hotfix-il2cpp
          path: |
            ci-hotfix-out/*.log
            ci-hotfix-out/Assembly-CSharp.injected.dll
          if-no-files-found: warn
          retention-days: 14
