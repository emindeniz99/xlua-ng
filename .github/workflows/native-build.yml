name: Native build and test (no release)

# Manual only while the repository is private: hosted runner minutes are billed.
# When the repository is public, add this trigger back under `on:`:
#   pull_request:
#     paths: ['build/**', 'Assets/XLua/Src/**', 'Test/**', '.github/workflows/native-build.yml']
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }} / Lua ${{ matrix.lua }}
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.3.6', '5.4.9', '5.5.1']
        platform: [linux, windows, windows-arm64, macos, android, ios]
        include:
          - platform: linux
            runner: ubuntu-26.04
          - platform: windows
            runner: windows-2022
          # Native Windows on Arm, so the checks below can load the DLL. build/make_win_arm64_*.bat
          # also cross-compiles on x64 (windows-2022) if this runner is unavailable; the checks
          # then skip themselves.
          - platform: windows-arm64
            runner: windows-11-arm
          - platform: macos
            runner: macos-26
          - platform: android
            runner: ubuntu-26.04
          - platform: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LUA_VERSION: ${{ matrix.lua }}
      PLATFORM: ${{ matrix.platform }}
      # Warnings in xLua's own C files fail the build (CMake reads XLUA_WERROR from
      # the environment; see build/README.md). MSVC /W4 printed no warning for them
      # on x64 or ARM64 (run 39066163133), so Windows fails on warnings too.
      XLUA_WERROR: 'ON'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install managed test tools
        if: matrix.platform == 'linux'
        # Same Homebrew bottle as macOS; run_managed.py fails unless it is Mono 6.14.1.
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mono
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install Android NDK
        if: matrix.platform == 'android'
        run: .github/scripts/install-android-ndk.sh
      - name: Build native plugins
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/xlua-build"
          plugins="$GITHUB_WORKSPACE/artifact/Plugins"
          # 5.5.1 -> lua55, the suffix of the build/make_<platform>_<lua>.sh scripts and plugin_* folders.
          short="${LUA_VERSION%.*}"
          short="lua${short//./}"
          if [[ "$PLATFORM" == android ]]; then
            # All four ABIs at API 23. The plugin folder gets the stripped library; the linked
            # one with its symbols goes to the symbols artifact (build/README.md, "Android libraries").
            XLUA_BUILD_ROOT="$root" XLUA_JOBS=4 "build/make_android_${short}.sh"
            mkdir -p "$plugins" "$GITHUB_WORKSPACE/symbols"
            cp -R "$root/plugin_${short}/Plugins/Android" "$plugins/"
            cp -R "$root/plugin_${short}/symbols/Android" "$GITHUB_WORKSPACE/symbols/"
          elif [[ "$PLATFORM" == ios ]]; then
            # The device library and the arm64 simulator library, which the plugin selector
            # takes for a Target SDK = Simulator SDK build (Plugins/iOS/xlua-variants/simulator/).
            XLUA_BUILD_ROOT="$root" "build/make_ios_${short}.sh"
            XLUA_BUILD_ROOT="$root" XLUA_IOS_SDK=simulator "build/make_ios_${short}.sh"
            mkdir -p "$plugins"
            cp -R "$root/plugin_${short}/Plugins/iOS" "$plugins/"
          elif [[ "$PLATFORM" == windows-arm64 ]]; then
            cmake -S build -B "$root" -DLUA_VERSION="$LUA_VERSION" -A ARM64
            cmake --build "$root" --config Release --parallel 4
            mkdir -p "$plugins/arm64"
            cp "$root/Release/xlua.dll" "$plugins/arm64/"
          else
            extra=()
            if [[ "$PLATFORM" == macos ]]; then extra+=(-DBUILD_SILICON=ON); fi
            cmake -S build -B "$root" -DCMAKE_BUILD_TYPE=Release -DLUA_VERSION="$LUA_VERSION" "${extra[@]}"
            cmake --build "$root" --config Release --parallel 4
            if [[ "$PLATFORM" == windows ]]; then
              mkdir -p "$plugins/x86_64"
              cp "$root/Release/xlua.dll" "$plugins/x86_64/"
            elif [[ "$PLATFORM" == macos ]]; then
              mkdir -p "$plugins/arm64"
              cp "$root/libxlua.dylib" "$plugins/arm64/"
            else
              mkdir -p "$plugins/x86_64"
              cp "$root/libxlua.so" "$plugins/x86_64/"
            fi
          fi
      - name: Verify the macOS and iOS deployment targets
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        # Fails when the plugin needs a newer OS than macOS 12.0 or iOS 15.0 (build/README.md),
        # or when the simulator library is not built for the iOS Simulator.
        run: |
          if [[ "$PLATFORM" == macos ]]; then
            python3 Test/Native/check_apple_minos.py --platform macos artifact/Plugins/arm64/libxlua.dylib
          else
            python3 Test/Native/check_apple_minos.py --platform ios artifact/Plugins/iOS/libxlua.a
            python3 Test/Native/check_apple_minos.py --platform iossimulator artifact/Plugins/iOS/xlua-variants/simulator/libxlua.a
          fi
      - name: Verify Android ELF machine, 16 KB alignment and exports
        if: matrix.platform == 'android'
        run: python3 -I Test/Native/check_android_elf.py artifact/Plugins/Android/libs/*/libxlua.so
      - name: Verify host exports and native regressions
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        run: |
          if [[ "$PLATFORM" == macos ]]; then plugin=artifact/Plugins/arm64/libxlua.dylib; else plugin=artifact/Plugins/x86_64/libxlua.so; fi
          python3 Test/Native/check_exports.py "$plugin"
          python3 Test/Native/profiler_smoke.py "$plugin"
          python3 Test/Native/native_regression.py "$plugin"
      - name: Build LuaJIT for Windows ARM64
        if: matrix.platform == 'windows-arm64' && matrix.lua == '5.5.1'
        # The script opens an ARM64 (or x64_arm64 cross) developer prompt with vswhere.
        shell: cmd
        run: build\make_win_arm64_luajit.bat
      - name: Verify Windows ARM64 exports and native regressions
        if: matrix.platform == 'windows-arm64' && runner.arch == 'ARM64'
        run: |
          set -euo pipefail
          # ctypes can only load the DLL from an ARM64 Python, not from an emulated x64 one.
          python -c "import platform, sys; m = platform.machine(); print(sys.version, m); sys.exit(0 if m.upper() == 'ARM64' else 'Python runs as ' + m + ' and cannot load an ARM64 DLL')"
          plugin=artifact/Plugins/arm64/xlua.dll
          python Test/Native/check_exports.py "$plugin"
          python Test/Native/profiler_smoke.py "$plugin"
          python Test/Native/native_regression.py "$plugin"
          if [[ "$LUA_VERSION" == 5.5.1 ]]; then
            python Test/Native/check_exports.py build/plugin_luajit/Plugins/arm64/xlua.dll
            python Test/Native/native_regression.py build/plugin_luajit/Plugins/arm64/xlua.dll
          fi
      # The .NET SDK pinned in mise.toml, and nothing else from it: the other
      # steps use the runner image's CMake and Python. The source generator's
      # checks need its csc (run_managed.py --source-gen, luacats_check.py,
      # hotfix_check.py, coverage_cs_dotnet.py).
      - name: Install the .NET SDK (mise.toml)
        if: matrix.platform == 'linux'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # A mise release past the seven-day window; Renovate bumps it.
          version: 2026.10.4
          install_args: dotnet
          cache: false
      - name: Run managed suite with reflection and the source generator (plain, GCM, no registration)
        if: matrix.platform == 'linux'
        run: python3 Test/Native/run_managed.py --source-gen --source-gen-minimize --source-gen-fallback --plugin artifact/Plugins/x86_64/libxlua.so --output "$RUNNER_TEMP/managed-tests"
      - name: Measure C# coverage of the runtime and the tools (Mono coverage profiler)
        if: matrix.platform == 'linux' && matrix.lua == '5.5.1'
        run: python3 Test/Native/coverage_cs.py --plugin artifact/Plugins/x86_64/libxlua.so --output "$RUNNER_TEMP/cs-coverage"
      - name: Upload the C# coverage report
        if: always() && matrix.platform == 'linux' && matrix.lua == '5.5.1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cs-coverage-lua-${{ matrix.lua }}-linux
          path: |
            ${{ runner.temp }}/cs-coverage/coverage/*.txt
            ${{ runner.temp }}/cs-coverage/coverage/summary.json
            ${{ runner.temp }}/cs-coverage/coverage/annotated/
          if-no-files-found: warn
          retention-days: 7
      - name: Measure C# branch coverage on .NET (coverlet)
        if: matrix.platform == 'linux' && matrix.lua == '5.5.1'
        # coverage_cs_dotnet.py takes the SDK from `mise which dotnet`; about 30 seconds.
        run: python3 Test/Native/coverage_cs_dotnet.py --plugin artifact/Plugins/x86_64/libxlua.so --output "$RUNNER_TEMP/cs-branch-coverage"
      - name: Upload the C# branch coverage report
        if: always() && matrix.platform == 'linux' && matrix.lua == '5.5.1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cs-branch-coverage-lua-${{ matrix.lua }}-linux
          path: |
            ${{ runner.temp }}/cs-branch-coverage/coverage/*.txt
            ${{ runner.temp }}/cs-branch-coverage/coverage/summary.json
            ${{ runner.temp }}/cs-branch-coverage/coverage/*/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Check script signing tools and SignatureLoader
        if: matrix.platform == 'linux'
        run: python3 Test/Native/signature_check.py --output "$RUNNER_TEMP/signature-check"
      - name: Check LuaCATS definitions (golden files and lua-language-server)
        if: matrix.platform == 'linux'
        run: python3 Test/Native/luacats_check.py --plugin artifact/Plugins/x86_64/libxlua.so --lua-version "$LUA_VERSION" --output "$RUNNER_TEMP/luacats" --download-luals
      - name: Check hotfix injection end to end (XLuaHotfixInject, Mono.Cecil)
        if: matrix.platform == 'linux' && matrix.lua == '5.5.1'
        run: python3 Test/Native/hotfix_check.py --plugin artifact/Plugins/x86_64/libxlua.so --output "$RUNNER_TEMP/hotfix-check"
      - name: Check that DEPENDENCIES.md and sbom.cdx.json are current
        if: matrix.platform == 'linux' && matrix.lua == '5.5.1'
        run: python3 Tools/dependencies.py --check
      - name: Check P/Invoke signatures against the C definitions (WebAssembly and WebAssembly64 ABI)
        if: matrix.platform == 'linux' && matrix.lua == '5.5.1'
        run: python3 -I Test/Native/check_pinvoke_abi.py
      - name: Upload test logs
        if: always() && matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-lua-${{ matrix.lua }}-linux
          path: ${{ runner.temp }}/managed-tests/managed-suite*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload plugins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xlua-lua-${{ matrix.lua }}-${{ matrix.platform }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Upload the Android symbols (the linked libraries, for crash symbolication)
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xlua-lua-${{ matrix.lua }}-android-symbols
          path: symbols/
          if-no-files-found: error
          retention-days: 7
      - name: Upload the Windows ARM64 LuaJIT plugin
        if: matrix.platform == 'windows-arm64' && matrix.lua == '5.5.1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xlua-luajit-windows-arm64
          path: build/plugin_luajit/
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    name: linux / ASan + UBSan
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      XLUA_WERROR: 'ON'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install managed test tools
        # Same Homebrew bottle as the native job; run_managed.py requires Mono 6.14.1.
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mono
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      # For the managed suite's source generator passes in sanitize.sh and for
      # luacats_check.py, which compile with the .NET SDK's csc.
      - name: Install the .NET SDK (mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # A mise release past the seven-day window; Renovate bumps it.
          version: 2026.10.4
          install_args: dotnet
          cache: false
      - name: Build with sanitizers and run all checks
        env:
          CC: gcc
        run: Test/Native/sanitize.sh "$RUNNER_TEMP/sanitize"
      - name: Check LuaCATS definitions on LuaJIT (golden files and lua-language-server)
        # Plain build: sanitize.sh already built the static LuaJIT library, so make only checks it.
        run: |
          set -euo pipefail
          make -C build/luajit-2.1 BUILDMODE=static XCFLAGS=-fPIC >/dev/null
          cmake -S build -B "$RUNNER_TEMP/luajit" -DCMAKE_BUILD_TYPE=Release -DUSING_LUAJIT=ON
          cmake --build "$RUNNER_TEMP/luajit" --parallel 4
          python3 Test/Native/luacats_check.py --luajit --plugin "$RUNNER_TEMP/luajit/libxlua.so" --output "$RUNNER_TEMP/luacats-luajit" --download-luals

  # The sanitize.sh runs beyond the default VERSIONS of the legacy preset: the core preset's
  # library, the minimal preset, legacy with XLUA_LUASCRIPT=ON and LuaJIT with
  # UINT_ESPECIALLY (docs/research/apicheck-runs.md). A job of its own, so the default job
  # keeps its time; about 25 minutes on a laptop for all four.
  sanitizers-extra:
    name: linux / ASan + UBSan (core, minimal, LuaScript, luajit-uint)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      XLUA_WERROR: 'ON'
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install managed test tools
        # Same Homebrew bottle as the native job; run_managed.py requires Mono 6.14.1.
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mono
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      # sanitize.sh runs the managed suite's source generator passes with the .NET SDK's csc.
      - name: Install the .NET SDK (mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # A mise release past the seven-day window; Renovate bumps it.
          version: 2026.10.4
          install_args: dotnet
          cache: false
      - name: Core preset (Lua 5.4.9 and 5.5.1, both export lists, core_smoke)
        run: VERSIONS="core-5.4.9 core-5.5.1" Test/Native/sanitize.sh "$RUNNER_TEMP/sanitize-core"
      - name: LuaJIT with UINT_ESPECIALLY
        run: VERSIONS=luajit-uint Test/Native/sanitize.sh "$RUNNER_TEMP/sanitize-luajit-uint"
      - name: Minimal preset (Lua 5.3.6, 5.4.9, 5.5.1 and LuaJIT)
        run: XLUA_PRESET=minimal Test/Native/sanitize.sh "$RUNNER_TEMP/sanitize-minimal"
      - name: Legacy preset with XLUA_LUASCRIPT=ON (Lua 5.4.9 and 5.5.1)
        run: XLUA_LUASCRIPT=ON VERSIONS="5.4.9 5.5.1" Test/Native/sanitize.sh "$RUNNER_TEMP/sanitize-luascript"

  # Test/Native/webgl_compile_check.py with an official Emscripten release instead of a Unity
  # editor's copy: 4.0.20 is the version of Unity 6000.6's WebGL module, and the script uses
  # 6000.6's flags. The archive is the one emsdk installs for 4.0.20 (the release hash comes
  # from emsdk's emscripten-releases-tags.json), checked against its SHA-256.
  webgl:
    name: linux / WebGL compile (Emscripten 4.0.20)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Emscripten 4.0.20
        env:
          EMSCRIPTEN_URL: https://storage.googleapis.com/webassembly/emscripten-releases-builds/linux/c387d7a7e9537d0041d2c3ae71b7538cc978104e/wasm-binaries.tar.xz
          EMSCRIPTEN_SHA256: a06e7ddda0c168f7ad52e6e0509c98db3545dcb254d3b9052e9e6b8423eaee7d
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/emscripten.tar.xz"
          curl -sSfL --retry 3 -o "$archive" "$EMSCRIPTEN_URL"
          echo "$EMSCRIPTEN_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/emscripten"
          tar -xJf "$archive" -C "$RUNNER_TEMP/emscripten"
          rm "$archive"
          grep -qx '4.0.20-git' "$RUNNER_TEMP/emscripten/install/emscripten/emscripten-version.txt"
      - name: Compile the WebGL plugin source, also from the UPM package
        run: python3 Test/Native/webgl_compile_check.py --output "$RUNNER_TEMP/webgl" --emscripten "$RUNNER_TEMP/emscripten/install" --package
      - name: Upload the compiler logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgl-compile-logs
          path: ${{ runner.temp }}/webgl/*.log
          if-no-files-found: warn
          retention-days: 7
